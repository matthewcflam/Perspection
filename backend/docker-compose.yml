services:
  cloudsql-proxy:
    # UPDATED: Using the modern V2 proxy image
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
    # V2 Command Syntax:
    # run <INSTANCE_CONNECTION_NAME> --address 0.0.0.0 --port 5432 --credentials-file <PATH>
    command:
      - "--address"
      - "0.0.0.0"
      - "--port"
      - "5432"
      - "--credentials-file"
      - "/secrets/service_account.json"
      - "cpen211-478908:us-central1:free-trial-first-project"
    volumes:
      - ./secrets:/secrets:ro

  backend:
    build: .
    env_file:
      - .flaskenv
    depends_on:
      - cloudsql-proxy
    ports:
      - "5001:5000"